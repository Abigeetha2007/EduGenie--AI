<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ app_name }} | AI Learning Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<main class="container">

    <header class="hero">

        <div>
            <p class="eyebrow">
                AI-POWERED LEARNING
            </p>

            <h1>EduGenie</h1>

            <p class="subtitle">
                Ask, understand, practice, summarize,
                and plan your learning journey.
            </p>
        </div>

        <span class="status-dot"></span>

    </header>


    <section class="card">

        <label for="task">
            Choose a task
        </label>

        <select id="task">

            <option value="qa">
                Ask a Question
            </option>

            <option value="explain">
                Explain a Topic
            </option>

            <option value="quiz">
                Generate Quiz
            </option>

            <option value="summarize">
                Summarize Text
            </option>

            <option value="learn">
                Recommend Learning Path
            </option>

        </select>


        <label for="inputText">
            Your input
        </label>

        <textarea
            id="inputText"
            rows="10"
            placeholder="Example: Explain the Pythagoras theorem in simple words."
        ></textarea>


        <div class="actions">

            <button id="submitBtn">
                Generate
            </button>

            <button
                id="clearBtn"
                class="secondary"
            >
                Clear
            </button>

        </div>


        <p class="hint">
            Tip: Use a specific topic or question
            for better results.
        </p>

    </section>


    <section
        id="resultCard"
        class="card result-card hidden"
    >

        <div class="result-header">

            <h2>Result</h2>

            <button
                id="copyBtn"
                class="copy"
            >
                Copy
            </button>

        </div>


        <div id="result"></div>

    </section>


    <footer>
        EduGenie • FastAPI + Google Gemini
    </footer>

</main>


<script src="{{ url_for('static', path='app.js') }}"></script>

</body>
</html>
